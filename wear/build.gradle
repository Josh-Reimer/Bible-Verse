// Wear OS companion, sharing the phone app's Play Store listing — see CLAUDE.md for the
// scope this was built to (a single "minimal verse view" screen: today's/a random verse and
// a die to reroll it — no share, since a bare watch has no share target to send to). It
// bundles its own copy of three of the phone app's translations (assets/, copied verbatim —
// see wear/src/main/assets) rather than depending on the :app module, since :app is an
// application module and can't be a library dependency; duplicating the handful of Kotlin
// files that read those assets keeps this module free-standing without touching :app at all.
//
// applicationId and signing are matched to :app on purpose: Play Console treats a Wear bundle
// as belonging to the phone app's existing listing (no separate store listing, no separate
// closed-testing requirement) only when both the package name and the signing certificate
// match — see the "same listing" discussion this was built for. versionCode/versionName are
// plain literals rather than shared with :app via some root-level source of truth, so bump
// both together by hand on each release; a two-module hobby project doesn't earn the
// extra machinery.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Upload-key details live in keystore.properties at the repo root, which is git-ignored —
// see :app's build.gradle, whose signing block this mirrors exactly. Both modules' release
// builds must be signed with the same key for Play to accept them as the same app.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'com.verse.of.the.day.wear'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.verse.of.the.day"
        // Wear OS 3 (Compose for Wear's baseline); the phone app's minSdk 27 doesn't apply
        // here since this targets watch hardware exclusively.
        minSdk = 30
        targetSdk = 36
        versionCode = 3
        versionName = "2.0"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.json:json:20231013'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
